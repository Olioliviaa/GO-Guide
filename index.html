<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🧚🏻‍♀️ 罗兰岗生活指南 🧚🏻‍♂️</title>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --primary-color: #2563eb;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --line-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 40px;
        }

        header {
            background-color: var(--card-bg);
            padding: 24px 16px 16px 16px;
            text-align: center;
            border-bottom: 1px solid var(--line-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        header p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .guide-container {
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .guide-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            text-decoration: none;
            color: inherit;
            display: block;
            transition: transform 0.2s;
        }

        .guide-card:active {
            transform: scale(0.98);
        }

        .guide-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: #cbd5e1;
        }

        .guide-content {
            padding: 16px;
        }

        .guide-tag {
            display: inline-block;
            background-color: #eff6ff;
            color: var(--primary-color);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        .guide-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .guide-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .nav-hint {
            font-size: 0.85rem;
            color: var(--primary-color);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
        }
    </style>
    <!-- 🔒 核心提速策略：直接在头部引入本地的 guide-data.js，彻底粉碎和摆脱谷歌的网络限流延迟 -->
    <script src="./guide-data.js"></script>
</head>
<body>

    <header>
        <h1>🧚🏻‍♀️ 罗兰岗生活指南 🧚🏻‍♂️</h1>
        <p>华人聚居区与新兴“中国城”。点击任一卡片即可快捷导航。</p>
    </header>

    <div class="guide-container" id="guide-box"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 严密的安全检查：如果本地数据加载成功，则瞬间渲染
            if (typeof myGuideData !== 'undefined' && Array.isArray(myGuideData)) {
                renderGuideList(myGuideData);
            } else {
                document.getElementById('guide-box').innerHTML = `
                    <div style="text-align:center;padding:40px;color:#64748b;">
                        ⚠️ 未检测到 guide-data.js 配置文件，请确认文件是否已在 GitHub 仓库中创建。
                    </div>`;
            }
        });

        // 将读取到的本地数据极速转换为卡片并渲染到屏幕上
        function renderGuideList(data) {
            const container = document.getElementById('guide-box');
            container.innerHTML = '';

            data.forEach(item => {
                const title = item["名称"] || '未命名地点';
                const tag = item["类别"] || '未分类';
                const desc = item["描述"] || '暂无详细描述。';
                const img = item["图片"] || 'https://unsplash.com';
                const url = item["导航链接"] || '#';

                const cardHTML = `
                    <a href="${url}" target="_blank" class="guide-card">
                        <img src="${img}" alt="${title}" class="guide-img">
                        <div class="guide-content">
                            <span class="guide-tag">📍 ${tag}</span>
                            <div class="guide-title">${title}</div>
                            <div class="guide-desc">${desc}</div>
                            <div class="nav-hint">🗺️ 点击打开 Google Maps 快捷导航 →</div>
                        </div>
                    </a>
                `;
                container.innerHTML += cardHTML;
            });
        }
    </script>
</body>
</html>
